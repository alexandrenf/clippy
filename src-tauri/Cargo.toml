[package]
name = "clippy"
version = "0.1.1"
description = "Clippy — a polished capture panel for AI-assisted work"
authors = ["Clippy contributors", "Cooper contributors"]
license = "Apache-2.0"
default-run = "clippy"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
chacha20poly1305 = "0.10"
hkdf = "0.12"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
open = "5"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
arboard = "3"
window-vibrancy = "0.6"
enigo = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }
security-framework = "3"

[profile.release]
panic = "abort"
lto = "thin"
opt-level = "s"
strip = true
