name: ClippyMobile
options:
  bundleIdPrefix: app.clippy
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Staging: debug
  Release: release
  Production: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.8.1
targets:
  ClippyMobile:
    type: application
    platform: iOS
    info:
      path: ClippyMobile/Info.plist
      properties:
        CFBundleDisplayName: Clippy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - clippy-sync
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Take photos to attach to your Clippy items.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WORKOS_ISSUER: $(WORKOS_ISSUER)
        WORKOS_CLIENT_ID: $(WORKOS_CLIENT_ID)
        WORKOS_AUDIENCE: $(WORKOS_AUDIENCE)
        WORKOS_REDIRECT_URI: clippy-sync://auth/callback
        CONVEX_URL: $(CONVEX_URL)
        SYNC_ENVIRONMENT: $(SYNC_ENVIRONMENT)
    sources:
      - path: Shared
      - path: ClippyMobile
    dependencies:
      - package: ConvexMobile
    configFiles:
      Debug: Config/Staging.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
      Production: Config/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clippy.mobile
        PRODUCT_NAME: Clippy
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 6
        DEVELOPMENT_TEAM: HL8KH2NA9S
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Clippy Staging:
    build:
      targets:
        ClippyMobile: all
    run:
      config: Staging
    test:
      config: Staging
    archive:
      config: Staging
  Clippy Production:
    build:
      targets:
        ClippyMobile: all
    run:
      config: Production
    test:
      config: Production
    archive:
      config: Production
